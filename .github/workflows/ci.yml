name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-unit:
    name: Typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:unit

  integration:
    name: Integration + concurrency (real PostgreSQL and SQS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: cp .env.example .env
      - name: Start PostgreSQL and MiniStack only (the tests run their own app instances)
        run: docker compose up -d --wait postgres ministack
      - name: Apply migrations (up, down, up again - they must be reversible)
        run: |
          bun run migration:up
          bun run migration:down
          bun run migration:up
      - name: Schema drift check (entities must match the migrated database)
        run: bun run migration:check
      - name: Integration tests
        run: bun run test:integration
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down -v

  full-stack:
    name: Whole system with docker compose (API, events, Keycloak, Prometheus, Grafana)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the image and start every service
        run: docker compose up -d --build --wait
      - name: Migrations ran once and the app is ready
        run: |
          test "$(docker inspect -f '{{.State.ExitCode}}' $(docker compose ps -aq migrate))" = 0
          curl -fsS http://localhost:3000/health/ready
      - name: Smoke test through the container (wallet, bet, idempotent replay, balance, reconciliation, console)
        run: |
          set -euo pipefail
          api=http://localhost:3000
          json='content-type: application/json'
          wallet=$(curl -fsS -X POST $api/wallets -H "$json" -d '{"playerId":"ci-smoke","initialBalance":{"amount":"100.00","currency":"BRL"}}')
          id=$(echo "$wallet" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
          bet='{"providerId":"acme","externalTransactionId":"ci-bet-1","kind":"BET","playerId":"ci-smoke","walletId":"'$id'","money":{"amount":"10.00","currency":"BRL"},"roundId":"r1","gameId":"fortune-chimp"}'
          idem='idempotency-key: acme:ci-bet-1'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST $api/wagering/transactions -H "$json" -H "$idem" -d "$bet")" = 201
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST $api/wagering/transactions -H "$json" -d "$bet")" = 400
          replay=$(curl -s -w ' %{http_code}' -X POST $api/wagering/transactions -H "$json" -H "$idem" -d "$bet")
          echo "$replay" | grep -q '"idempotentReplay":true'
          echo "$replay" | grep -q ' 200$'
          curl -fsS $api/wallets/$id | grep -q '"balance":{"amount":"90.00","currency":"BRL"}'
          curl -fsS -X POST $api/wallets/$id/reconciliation | grep -q '"consistent":true'
          curl -fsS $api/metrics | grep -q '^wager_transactions_total'
          # the browser test console ships in the image, with its strict content security policy
          curl -fsS -o /dev/null $api/ui
          curl -fsS -o /dev/null $api/ui/app.js
          curl -fsSI $api/ui | grep -qi "^content-security-policy: default-src 'none'"
      - name: Events reach the downstream consumer (outbox, then SQS, then deduplicating consumer)
        run: |
          for i in $(seq 1 30); do
            stats=$(curl -fsS http://localhost:3100/api/events || true)
            if echo "$stats" | grep -q '"WalletBalanceChanged"'; then break; fi
            sleep 2
          done
          echo "$stats" | grep -q '"WalletBalanceChanged"'
          echo "$stats" | grep -q '"invalid":0'
          echo "$stats" | grep -q '"outOfOrder":0'
          curl -fsS -o /dev/null http://localhost:3100/
      - name: Prometheus scrapes the API and Grafana has the provisioned dashboard
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9090/api/v1/targets | grep -q '"health":"up"'; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:9090/api/v1/targets | grep -q '"health":"up"'
          curl -fsS -u admin:admin http://localhost:3001/api/datasources | grep -q '"type":"prometheus"'
          curl -fsS -u admin:admin http://localhost:3001/api/dashboards/uid/wagering | grep -q '"title":"Wagering Processor"'
          curl -fsS http://localhost:3001/api/dashboards/uid/wagering | grep -q '"title":"Wagering Processor"' # no login needed to look
      - name: Every dashboard query is valid and its metrics exist (retried because rate() needs two scrapes)
        run: |
          for i in $(seq 1 12); do
            if node docker/grafana/check-queries.mjs; then exit 0; fi
            sleep 5
          done
          node docker/grafana/check-queries.mjs
      - name: Turn authentication on (same stack, AUTH_MODE=jwt) and test with real Keycloak tokens
        run: |
          AUTH_MODE=jwt docker compose up -d --wait app
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/wallets/00000000-0000-0000-0000-000000000000)" = 401
          bash docker/keycloak/smoke.sh
      - name: Stop is graceful and prompt (SIGTERM as PID 1; a leaked shutdown timer once made this take 20 s)
        run: |
          start=$(date +%s)
          docker compose stop app events-consumer
          elapsed=$(( $(date +%s) - start ))
          for svc in app events-consumer; do
            code=$(docker inspect -f '{{.State.ExitCode}}' $(docker compose ps -aq $svc))
            echo "$svc exit code $code"
            test "$code" = 0
          done
          echo "both stopped in ${elapsed}s"
          test "$elapsed" -le 15
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down -v
