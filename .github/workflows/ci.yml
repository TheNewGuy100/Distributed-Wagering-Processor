name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-unit:
    name: Typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:unit

  integration:
    name: Integration + concurrency (real PostgreSQL and SQS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: cp .env.example .env
      - name: Start PostgreSQL and MiniStack only (the tests run their own app instances)
        run: docker compose up -d --wait postgres ministack
      - name: Apply migrations (up, down, up again - they must be reversible)
        run: |
          bun run migration:up
          bun run migration:down
          bun run migration:up
      - name: Schema drift check (entities must match the migrated database)
        run: bun run migration:check
      - name: Integration tests
        run: bun run test:integration
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down -v

  docker-stack:
    name: Docker image + whole stack (compose up)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the image and start postgres, ministack, migrate and app
        run: docker compose up -d --build --wait
      - name: Migrations ran once and the app is ready
        run: |
          test "$(docker inspect -f '{{.State.ExitCode}}' $(docker compose ps -aq migrate))" = 0
          curl -fsS http://localhost:3000/health/ready
      - name: Smoke test through the container (wallet, bet, idempotent replay, balance, reconciliation)
        run: |
          set -euo pipefail
          api=http://localhost:3000
          json='content-type: application/json'
          wallet=$(curl -fsS -X POST $api/wallets -H "$json" -d '{"playerId":"ci-smoke","currency":"BRL","openingCredit":"100.00"}')
          id=$(echo "$wallet" | grep -o '"walletId":"[^"]*"' | cut -d'"' -f4)
          bet='{"providerId":"acme","externalTransactionId":"ci-bet-1","kind":"BET","playerId":"ci-smoke","currency":"BRL","amount":"10.00","roundId":"r1"}'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST $api/wagering/transactions -H "$json" -d "$bet")" = 201
          replay=$(curl -s -w ' %{http_code}' -X POST $api/wagering/transactions -H "$json" -d "$bet")
          echo "$replay" | grep -q '"idempotentReplay":true'
          echo "$replay" | grep -q ' 200$'
          curl -fsS $api/wallets/$id | grep -q '"balance":"90.00"'
          curl -fsS -X POST $api/wallets/$id/reconciliation | grep -q '"divergent":false'
          curl -fsS $api/metrics | grep -q '^wager_transactions_total'
          # the browser test console ships in the image, with its strict content security policy
          curl -fsS -o /dev/null $api/ui
          curl -fsS -o /dev/null $api/ui/app.js
          curl -fsSI $api/ui | grep -qi "^content-security-policy: default-src 'none'"
      - name: Stop is graceful and prompt (SIGTERM as PID 1; a leaked shutdown timer once made this take 20 s)
        run: |
          start=$(date +%s)
          docker compose stop app
          elapsed=$(( $(date +%s) - start ))
          code=$(docker inspect -f '{{.State.ExitCode}}' $(docker compose ps -aq app))
          echo "exit code $code after ${elapsed}s"
          test "$code" = 0
          test "$elapsed" -le 10
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down -v

  docker-stack-keycloak:
    name: Real identity provider (Keycloak) in front of the API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_FILES: -f docker-compose.yml -f docker-compose.auth.yml
    steps:
      - uses: actions/checkout@v4
      - name: Build the image and start the stack with Keycloak
        run: docker compose $COMPOSE_FILES up -d --build --wait
      - name: Tokens issued by Keycloak are validated; roles and provider scoping are enforced
        run: bash docker/keycloak/smoke.sh
      - name: Service logs on failure
        if: failure()
        run: docker compose $COMPOSE_FILES logs --no-color
      - name: Stop services
        if: always()
        run: docker compose $COMPOSE_FILES down -v
