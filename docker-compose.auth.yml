# Overlay that puts a REAL identity provider in front of the API (development only).
#
#   docker compose -f docker-compose.yml -f docker-compose.auth.yml up -d --build --wait
#
# Keycloak imports docker/keycloak/wagering-realm.json: two game providers (acme, globex) and an operations client, all
# using the client-credentials grant. See README.md ("Authentication") for the token requests.
#
# The issuer is the PUBLIC address (http://localhost:8081/realms/wagering, what tokens carry in `iss`), while the API
# fetches the signing keys over the compose network (AUTH_JWKS_URI): the usual split between the issuer URL clients
# see and the internal back-channel URL.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8081
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./docker/keycloak/wagering-realm.json:/opt/keycloak/data/import/wagering-realm.json:ro
    ports: ["8081:8080"]
    healthcheck:
      # The image has neither curl nor wget; the management port (9000) serves the health endpoint.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    environment:
      AUTH_MODE: jwt
      AUTH_ISSUER: http://localhost:8081/realms/wagering
      AUTH_JWKS_URI: http://keycloak:8080/realms/wagering/protocol/openid-connect/certs
      AUTH_AUDIENCE: wagering-api
      AUTH_ALLOW_INSECURE_ISSUER: "true" # plain http is acceptable for this local demo only
    depends_on:
      keycloak:
        condition: service_healthy
