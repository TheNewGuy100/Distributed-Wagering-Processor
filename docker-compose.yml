services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 20

  ministack:
    image: ministackorg/ministack:1.5.38
    ports: ["4566:4566"]
    healthcheck:
      # The image ships python but neither wget nor curl.
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:4566/_ministack/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 20
