# Whole stack:   docker compose up --build        (API on http://localhost:3000)
# Only the infra: docker compose up -d --wait postgres ministack   (what the tests and `bun run start` use)
x-app-environment: &app-environment
  PORT: "3000"
  DATABASE_URL: postgresql://wagering:wagering@postgres:5432/wagering
  AWS_ENDPOINT_URL: http://ministack:4566
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  SQS_QUEUE_NAME: wager-transactions.fifo
  SQS_DLQ_NAME: wager-transactions-dlq.fifo

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 20

  ministack:
    image: ministackorg/ministack:1.5.38
    ports: ["4566:4566"]
    healthcheck:
      # The image ships python but neither wget nor curl.
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:4566/_ministack/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 20

  # One-shot: applies the migrations, then exits. The app starts only after it succeeded.
  migrate:
    build: .
    command: ["bun", "scripts/migrate.ts", "up"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    ports: ["3000:3000"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      ministack:
        condition: service_healthy
    healthcheck:
      # Readiness: PostgreSQL and SQS reachable (the image has bun, not curl).
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    # Time for the graceful shutdown: drain in-flight SQS messages, finish the outbox batch.
    stop_grace_period: 30s
